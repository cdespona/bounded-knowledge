<svg xmlns="http://www.w3.org/2000/svg" width="680" height="960" viewBox="0 0 680 960" role="img"><title>Conductor flow: three workflows and two human gates</title><desc>Workflow survey: discover and select evidence, cartographer and curator up to the questionnaire. Human gate: answer. Workflow synthesis: synthesis, extract, validate, link-config and review. Human gate: approve the digest. Workflow promotion: promote into the catalog.</desc>
<style>
  :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --b:#8c959f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --b:#6e7681; } }
  .bg { fill:var(--bg); }
  text { font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill:var(--fg); }
  .th { font-size:14px; font-weight:600; }
  .ts { font-size:12px; fill:var(--muted); }
  .arr { stroke:var(--b); stroke-width:1.5; fill:none; }
  .c-gray rect, rect.c-gray { fill:#eaeef2; stroke:#8c959f; }
  .c-purple rect, rect.c-purple { fill:#ece6fb; stroke:#8250df; }
  .c-coral rect, rect.c-coral { fill:#fde8e1; stroke:#d4562e; }
  .c-gray text, .c-purple text, .c-coral text { fill:#1f2328; }
  .c-gray .ts, .c-purple .ts, .c-coral .ts { fill:#424a53; }
</style>
<rect class="bg" width="680" height="960"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="20" width="600" height="312" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="60" y="44">Workflow 1: survey</text>
<g class="c-gray"><rect x="190" y="56" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="74" text-anchor="middle" dominant-baseline="central">Discover + select evidence</text><text class="ts" x="340" y="92" text-anchor="middle" dominant-baseline="central">Deterministic, per repository</text></g>
<line x1="340" y1="106" x2="340" y2="124" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="190" y="126" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="144" text-anchor="middle" dominant-baseline="central">Cartographer</text><text class="ts" x="340" y="162" text-anchor="middle" dominant-baseline="central">Model, per repository</text></g>
<line x1="340" y1="176" x2="340" y2="194" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="190" y="196" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="214" text-anchor="middle" dominant-baseline="central">Curator + binding questions</text><text class="ts" x="340" y="232" text-anchor="middle" dominant-baseline="central">Model + deterministic, all apps</text></g>
<line x1="340" y1="246" x2="340" y2="264" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="190" y="266" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="284" text-anchor="middle" dominant-baseline="central">Questionnaire</text><text class="ts" x="340" y="302" text-anchor="middle" dominant-baseline="central">Validated file on disk</text></g>
<line x1="340" y1="316" x2="340" y2="360" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="190" y="362" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="380" text-anchor="middle" dominant-baseline="central">Gate: you answer</text><text class="ts" x="340" y="398" text-anchor="middle" dominant-baseline="central">Outside Conductor, takes days</text></g>
<line x1="340" y1="412" x2="340" y2="474" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="442" width="600" height="244" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="60" y="466">Workflow 2: synthesis</text>
<g class="c-purple"><rect x="190" y="476" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="494" text-anchor="middle" dominant-baseline="central">Synthesis</text><text class="ts" x="340" y="512" text-anchor="middle" dominant-baseline="central">Model, all apps + answers</text></g>
<line x1="340" y1="526" x2="340" y2="544" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="190" y="546" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="564" text-anchor="middle" dominant-baseline="central">Extract, validate, link-config</text><text class="ts" x="340" y="582" text-anchor="middle" dominant-baseline="central">Deterministic</text></g>
<line x1="340" y1="596" x2="340" y2="614" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="190" y="616" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="634" text-anchor="middle" dominant-baseline="central">Review</text><text class="ts" x="340" y="652" text-anchor="middle" dominant-baseline="central">Diff against catalog + digest</text></g>
<line x1="340" y1="666" x2="340" y2="710" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="190" y="712" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="730" text-anchor="middle" dominant-baseline="central">Gate: you approve the digest</text><text class="ts" x="340" y="748" text-anchor="middle" dominant-baseline="central">Or reject: nothing is written</text></g>
<line x1="340" y1="762" x2="340" y2="824" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="792" width="600" height="104" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="60" y="816">Workflow 3: promotion</text>
<g class="c-gray"><rect x="190" y="826" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="844" text-anchor="middle" dominant-baseline="central">Promote</text><text class="ts" x="340" y="862" text-anchor="middle" dominant-baseline="central">Single writer into the catalog</text></g>
<rect class="c-gray" x="90" y="918" width="16" height="16" rx="4" stroke-width="0.5"/><text class="ts" x="114" y="926" dominant-baseline="central">Deterministic</text>
<rect class="c-purple" x="260" y="918" width="16" height="16" rx="4" stroke-width="0.5"/><text class="ts" x="284" y="926" dominant-baseline="central">Model (Copilot)</text>
<rect class="c-coral" x="430" y="918" width="16" height="16" rx="4" stroke-width="0.5"/><text class="ts" x="454" y="926" dominant-baseline="central">Human gate</text>
</svg>

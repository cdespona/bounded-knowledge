# Runs the deterministic tooling's unit tests on the oldest and newest supported Python.
# Installs only the pinned parsers in requirements.txt. Nothing here calls Copilot or Conductor.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The supported minimum (AGENTS.md) and the newest stable release.
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      # Test fixtures create Git repositories and commit to them.
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: python -m unittest discover -s tools/tests -v
      - run: ./tools/landscape --help > /dev/null

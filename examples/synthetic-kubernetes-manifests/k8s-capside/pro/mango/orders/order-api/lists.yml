apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    spec:
      template:
        spec:
          containers: [{name: app, image: registry.example.invalid/orders/repeated:1}, {name: sidecar, image: registry.example.invalid/orders/repeated:1}]
  - apiVersion: batch/v1
    kind: Job
    spec:
      template:
        spec:
          containers:
            - name: worker
              image: registry.example.invalid/orders/list-job:1
---
apiVersion: v1
kind: PodList
items:
  - spec:
      containers:
        - name: pod
          image: registry.example.invalid/orders/list-pod:1
---
apiVersion: apps/v1
kind: DeploymentList
items:
  - spec: {template: {spec: {containers: [{name: deployment, image: registry.example.invalid/orders/list-deployment:1}]}}}
---
apiVersion: apps/v1
kind: StatefulSetList
items:
  - spec: {template: {spec: {containers: [{name: stateful, image: registry.example.invalid/orders/list-stateful:1}]}}}
---
apiVersion: apps/v1
kind: DaemonSetList
items:
  - spec: {template: {spec: {containers: [{name: daemon, image: registry.example.invalid/orders/list-daemon:1}]}}}
---
apiVersion: apps/v1
kind: ReplicaSetList
items:
  - spec: {template: {spec: {containers: [{name: replica, image: registry.example.invalid/orders/list-replica:1}]}}}
---
apiVersion: batch/v1
kind: JobList
items:
  - spec: {template: {spec: {containers: [{name: job, image: registry.example.invalid/orders/list-job-typed:1}]}}}
---
apiVersion: batch/v1
kind: CronJobList
items:
  - spec: {jobTemplate: {spec: {template: {spec: {containers: [{name: cron, image: registry.example.invalid/orders/list-cron:1}]}}}}}

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1220" viewBox="0 0 680 1220" role="img"><title>Conductor flow: a run folder, three workflows and the human gates</title><desc>Run init: a human chooses the applications and run.json is written once. Workflow survey: discover and select evidence per selection, cartographer per application, survey check (stops naming any application without a valid candidate), curator, questionnaire and answer sheet. Human gate: fill in the answer sheet. Workflow synthesis: record answers, synthesis, link and validate, review and run report. Workflow promotion: human gates for the digest and the approver's name, approve, promote into the catalog. Every file lives in the run folder work/runs/&lt;date&gt;-&lt;name&gt;/.</desc>
<style>
  :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --b:#8c959f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --b:#6e7681; } }
  .bg { fill:var(--bg); }
  text { font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill:var(--fg); }
  .th { font-size:14px; font-weight:600; }
  .ts { font-size:12px; fill:var(--muted); }
  .tp { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; fill:var(--muted); }
  .arr { stroke:var(--b); stroke-width:1.5; fill:none; }
  .c-gray rect, rect.c-gray { fill:#eaeef2; stroke:#8c959f; }
  .c-purple rect, rect.c-purple { fill:#ece6fb; stroke:#8250df; }
  .c-coral rect, rect.c-coral { fill:#fde8e1; stroke:#d4562e; }
  .c-gray text, .c-purple text, .c-coral text { fill:#1f2328; }
  .c-gray .ts, .c-purple .ts, .c-coral .ts { fill:#424a53; }
</style>
<rect class="bg" width="680" height="1220"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-coral"><rect x="190" y="20" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="38" text-anchor="middle" dominant-baseline="central">Run init: you choose the applications</text><text class="ts" x="340" y="56" text-anchor="middle" dominant-baseline="central">Selections resolved through the topology</text></g>
<text class="tp" x="502" y="45" dominant-baseline="central">run.json</text>
<line x1="340" y1="70" x2="340" y2="124" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="90" width="600" height="382" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="60" y="114">Workflow 1: survey</text>
<g class="c-gray"><rect x="190" y="126" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="144" text-anchor="middle" dominant-baseline="central">Discover + select evidence</text><text class="ts" x="340" y="162" text-anchor="middle" dominant-baseline="central">Deterministic, per selection, commits pinned</text></g>
<text class="tp" x="502" y="151" dominant-baseline="central">survey/&lt;app&gt;/</text>
<line x1="340" y1="176" x2="340" y2="194" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="190" y="196" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="214" text-anchor="middle" dominant-baseline="central">Cartographer</text><text class="ts" x="340" y="232" text-anchor="middle" dominant-baseline="central">Model, per application, two at a time</text></g>
<text class="tp" x="502" y="221" dominant-baseline="central">candidate.json</text>
<line x1="340" y1="246" x2="340" y2="264" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="190" y="266" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="284" text-anchor="middle" dominant-baseline="central">Survey check</text><text class="ts" x="340" y="302" text-anchor="middle" dominant-baseline="central">Every application has a valid candidate</text></g>
<line x1="490" y1="291" x2="518" y2="291" class="arr" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<text class="ts" x="524" y="284" dominant-baseline="central">Else stop, naming</text>
<text class="ts" x="524" y="299" dominant-baseline="central">the applications</text>
<line x1="340" y1="316" x2="340" y2="334" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="190" y="336" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="354" text-anchor="middle" dominant-baseline="central">Curator</text><text class="ts" x="340" y="372" text-anchor="middle" dominant-baseline="central">Model, all applications</text></g>
<text class="tp" x="502" y="361" dominant-baseline="central">curator-draft.json</text>
<line x1="340" y1="386" x2="340" y2="404" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="190" y="406" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="424" text-anchor="middle" dominant-baseline="central">Questionnaire + answer sheet</text><text class="ts" x="340" y="442" text-anchor="middle" dominant-baseline="central">Adds binding questions, sheet written once</text></g>
<text class="tp" x="502" y="431" dominant-baseline="central">answers/answers.md</text>
<line x1="340" y1="456" x2="340" y2="500" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="190" y="502" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="520" text-anchor="middle" dominant-baseline="central">Gate: you fill in the answer sheet</text><text class="ts" x="340" y="538" text-anchor="middle" dominant-baseline="central">Outside Conductor, takes days</text></g>
<line x1="340" y1="552" x2="340" y2="614" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="582" width="600" height="310" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="60" y="606">Workflow 2: synthesis</text>
<g class="c-gray"><rect x="190" y="616" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="634" text-anchor="middle" dominant-baseline="central">Record answers</text><text class="ts" x="340" y="652" text-anchor="middle" dominant-baseline="central">Deterministic</text></g>
<text class="tp" x="502" y="641" dominant-baseline="central">answers.json</text>
<line x1="340" y1="666" x2="340" y2="684" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="190" y="686" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="704" text-anchor="middle" dominant-baseline="central">Synthesis</text><text class="ts" x="340" y="722" text-anchor="middle" dominant-baseline="central">Model, all applications + answers</text></g>
<text class="tp" x="502" y="711" dominant-baseline="central">proposal.json</text>
<line x1="340" y1="736" x2="340" y2="754" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="190" y="756" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="774" text-anchor="middle" dominant-baseline="central">Link + validate</text><text class="ts" x="340" y="792" text-anchor="middle" dominant-baseline="central">Deterministic: link-config, proposal checks</text></g>
<text class="tp" x="502" y="781" dominant-baseline="central">linked-proposal.json</text>
<line x1="340" y1="806" x2="340" y2="824" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="190" y="826" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="844" text-anchor="middle" dominant-baseline="central">Review + run report</text><text class="ts" x="340" y="862" text-anchor="middle" dominant-baseline="central">Digest-bound diff; drift and usage apart</text></g>
<text class="tp" x="502" y="851" dominant-baseline="central">review/</text>
<line x1="340" y1="876" x2="340" y2="954" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="922" width="600" height="240" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="60" y="946">Workflow 3: promotion</text>
<g class="c-coral"><rect x="190" y="956" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="974" text-anchor="middle" dominant-baseline="central">Gates: you type the digest, then your name</text><text class="ts" x="340" y="992" text-anchor="middle" dominant-baseline="central">Or reject: nothing is written</text></g>
<line x1="340" y1="1006" x2="340" y2="1024" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="190" y="1026" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="1044" text-anchor="middle" dominant-baseline="central">Approve</text><text class="ts" x="340" y="1062" text-anchor="middle" dominant-baseline="central">Deterministic, stamps the approval time</text></g>
<text class="tp" x="502" y="1051" dominant-baseline="central">approval.json</text>
<line x1="340" y1="1076" x2="340" y2="1094" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="190" y="1096" width="300" height="50" rx="8" stroke-width="0.5"/><text class="th" x="340" y="1114" text-anchor="middle" dominant-baseline="central">Promote</text><text class="ts" x="340" y="1132" text-anchor="middle" dominant-baseline="central">Single writer into the catalog</text></g>
<rect class="c-gray" x="40" y="1182" width="16" height="16" rx="4" stroke-width="0.5"/><text class="ts" x="64" y="1190" dominant-baseline="central">Deterministic</text>
<rect class="c-purple" x="170" y="1182" width="16" height="16" rx="4" stroke-width="0.5"/><text class="ts" x="194" y="1190" dominant-baseline="central">Model (Copilot)</text>
<rect class="c-coral" x="310" y="1182" width="16" height="16" rx="4" stroke-width="0.5"/><text class="ts" x="334" y="1190" dominant-baseline="central">Human</text>
<text class="tp" x="410" y="1190" dominant-baseline="central">paths in work/runs/&lt;date&gt;-&lt;name&gt;/</text>
</svg>

# Third of three workflows chained by a run folder: gate on a human approval of the review digest, then promote.
# Validation, the review digest, the approval record and the single catalog writer are `landscape` commands;
# this file only routes. The first option of every gate is the safe one, so `--skip-gates` can never approve.
# The approver's name and digest are entered at the gates; `catalog approve` stamps the approval time.
# Run from the repository root.
workflow:
  name: promotion
  description: Gate on a human approval of a run's review digest, then promote its linked proposal.
  entry_point: approval_gate
  input:
    run:
      type: string
      description: Run folder whose synthesis wrote review/review.md.
    catalog:
      type: string
      description: Canonical catalog to promote into.
      default: catalog/landscape-catalog.json
    promotions:
      type: string
      description: Directory for promotion records.
      default: catalog/promotions
  limits:
    max_iterations: 6
    timeout_seconds: 7200

agents:
  - name: approval_gate
    type: human_gate
    prompt: |
      Read {{ workflow.input.run }}/review/review.md and the commit-drift warnings in
      {{ workflow.input.run }}/review/run-report.md. Approving binds your approval to the digest printed on the
      review's last line, so type that digest exactly. Nothing is promoted without it.
    options:
      - label: Reject or stop here
        value: reject
        route: $end
      - label: Approve and promote
        value: approve
        route: approver_gate
        prompt_for: digest

  - name: approver_gate
    type: human_gate
    prompt: Who is approving? Your name is recorded in the approval and promotion records.
    options:
      - label: Stop without approving
        value: reject
        route: $end
      - label: Record my name and approve
        value: approve
        route: approve
        prompt_for: approver

  - name: approve
    type: script
    command: ./tools/landscape
    args: [catalog, approve, --run, "{{ workflow.input.run }}", --current, "{{ workflow.input.catalog }}", --reviewed, "{{ approval_gate.output.additional_input.digest }}", --by, "{{ approver_gate.output.additional_input.approver }}"]
    routes:
      - to: promote
        when: "{{ output.exit_code == 0 }}"
      - to: $end

  - name: promote
    type: script
    command: ./tools/landscape
    args: [catalog, promote, --run, "{{ workflow.input.run }}", --catalog, "{{ workflow.input.catalog }}", --promotions, "{{ workflow.input.promotions }}"]
    routes:
      - to: $end

output:
  decision: "{{ approval_gate.output.selected if approval_gate is defined else 'not reached' }}"
  promoted: "{{ promote.output.stdout if promote is defined else '' }}"
